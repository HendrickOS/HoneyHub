# ==============================================================
# CONFIGURATION GENERALE - ENVIRONNEMENT DE DEVELOPPEMENT
# ==============================================================

# Nom identifiant de l'application au sein du registre
spring.application.name=HoneyHub

# --------------------------------------------------------------
# CONFIGURATION BASE DE DONNEES (LOCAL)
# --------------------------------------------------------------
# Connexion a l'instance locale MySQL avec creation automatique de la BDD si manquante
spring.datasource.url=jdbc:mysql://localhost:3306/ao7dvw_HoneyGroup_DB?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# --------------------------------------------------------------
# JPA / HIBERNATE
# --------------------------------------------------------------
# Utilisation du dialecte MySQL pour la compatibilite des types de champs
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mode "update" : Hibernate ajuste le schema selon les entites Java pour faciliter le dev
spring.jpa.hibernate.ddl-auto=update

# Debug : Activation de l'affichage et du formatage SQL dans la console Eclipse pour analyse
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --------------------------------------------------------------
# INITIALISATION DES DONNEES
# --------------------------------------------------------------
# Force l'execution systematique du script data.sql au demarrage.
# Indispensable pour recharger le jeu d'essai automatique apres chaque modification du schema.
# Force l'ex�cution du script SQL apr�s l'initialisation des entit�s JPA
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

