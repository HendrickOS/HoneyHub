# ==============================================================
# PROFIL PRODUCTION (Infomaniak Cloud)
# Ce fichier est active uniquement via le profil "prod"
# ==============================================================

# Configuration de la connexion a la base de donnees MySQL sur Alwaysdata
# Best Practice : Les secrets (mot de passe) sont injectes via des variables d'environnement
spring.datasource.url=jdbc:mysql://mysql-honeygroupitmada.alwaysdata.net/honeygroupitmada_honeyhub?useSSL=false&serverTimezone=UTC&nullCatalogMeansCurrent=true
spring.datasource.username=honeygroupitmada_faty
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
# Best Practice : ddl-auto=none en prod (pas d'alteration automatique des tables)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Desactiver l'initialisation SQL automatique (evite les conflits avec schema.sql ou data.sql)
spring.sql.init.mode=never

# Configuration du serveur
# Port d'ecoute dynamique injecte par Alwaysdata ou port 8080 par defaut
server.port=${PORT:8080}