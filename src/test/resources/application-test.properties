# Base de données H2 en mémoire pour les tests d'intégration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Désactiver les logs verbeux pendant les tests
logging.level.org.springframework=WARN
logging.level.fr.honeygroup=INFO

# Security
honeyhub.app.jwtSecret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
honeyhub.app.jwtExpirationMs=3600000
honeyhub.app.jwtRefreshExpirationMs=86400000

# Prevent execution of MySQL-specific data.sql on H2
spring.sql.init.mode=never

