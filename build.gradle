plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'fr.honeygroup'
version = '0.0.1-SNAPSHOT'
description = 'Projet Honey Group - Unification des portails'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    // Versions centralisées pour faciliter la maintenance des briques techniques complémentaires
    mapstructVersion = '1.5.5.Final'
    jjwtVersion = '0.11.5'
}

repositories {
    mavenCentral()
}

dependencies {

    // ==========================================
    // BLOC 1 : ECOSYSTEME CORE & SECURITE (SPRING BOOT)
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // --- Gestion des Jetons d'Accès (Stateless Architecture JWT) ---
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    
    // ==========================================
    // BLOC 2 : PERSISTANCE & PERSPECTIVES DEV
    // ==========================================
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Documentation d'Architecture (Interface Swagger UI) ---
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
    
    // Support Hibernate pour les types JSON (MySQL/PostgreSQL)
    implementation 'io.hypersistence:hypersistence-utils-hibernate-60:3.7.0'
    
    // ==========================================
    // BLOC 3 : COMPILATION, AUTOMATISATION & MAPPING (APT)
    // ==========================================
    // Lombok : Génération automatisée des Getters, Setters, et patterns Builder
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // MapStruct : Compilation de mappers DTO / BO découplés et hautement performants
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // ==========================================
    // BLOC 4 : ASSURANCE QUALITE & CAHIER DE RECETTE (TESTS)
    // ==========================================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    /*
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    */
    
    //Ajout pour les tests d'integration
    testImplementation 'org.springframework.security:spring-security-test'
    
    // Intégration Lombok pour l'écriture des tests unitaires et d'intégration
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}